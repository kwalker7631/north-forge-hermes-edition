# North Forge - Kyocera dashboard theme.
# 2026-09-15: lifted off near-black. noiseOpacity 1.0 + #041c1c made Env/Models
# unreadable until OS contrast was cranked. Forge gold stays. Not a new product.

name: north-forge-kyocera
label: "North Forge - Kyocera Edition"
description: "Readable charcoal + forge gold. Matches the desk, not a blackout."

palette:
  background: "#1C1914"
  midground: "#2A241C"
  foreground: "#F7EFE0"
  warmGlow: "rgba(255, 140, 26, 0.18)"
  noiseOpacity: 0.15

layout:
  radius: "0.5rem"
  density: "comfortable"

layoutVariant: standard

colorOverrides:
  primary: "#FF8C1A"
  secondary: "#C4A36A"
  accent: "#FFC64B"
  destructive: "#E4572E"
  success: "#5FB55F"
  warning: "#E8A33D"
  border: "#8A7349"
