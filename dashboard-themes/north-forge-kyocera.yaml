# North Forge - Kyocera Edition dashboard theme.
#
# Added 2026-09-13 (post-use finding): the web dashboard/terminal showed stock
# Hermes branding with no North Forge/Kyocera identity applied - a real "tear
# off the facade" risk for a teammate who trusts the CLI's already-branded
# North Forge identity (skins/north-forge.yaml) then opens the web view and
# sees a different, unbranded product. This reuses that same CLI skin's
# actual forge-gold-on-dark-iron palette (see skins/north-forge.yaml's own
# comments / CHG-2026-09-07-021) rather than inventing a new look, so the CLI
# and web surfaces read as one product. Real schema, confirmed against
# hermes_cli/web_server_dashboard.py's _normalise_theme_definition - not
# guessed. layoutVariant is "standard" deliberately: a "cockpit" HUD-style
# reskin is a real, separate, larger design decision (see
# DEMO_PREP_BACKLOG.md item 1 in north-forge-hermes-edition), not something
# to default into as a side effect of this fix.
#
# Lives at <HERMES_HOME>/dashboard-themes/ (the dashboard's actual "process
# launch home", not literally the OS user profile) - confirmed by reading
# _discover_user_themes() directly, not assumed from the backlog note.

name: north-forge-kyocera
label: "North Forge - Kyocera Edition"
description: "Forge-gold on dark iron, matching the CLI's own North Forge skin (skins/north-forge.yaml)."

palette:
  background: "#041c1c"
  midground: "#1A1410"
  foreground: "#F3E6D0"
  warmGlow: "rgba(255, 140, 26, 0.35)"
  noiseOpacity: 1.0

layout:
  radius: "0.5rem"
  density: "comfortable"

layoutVariant: standard

colorOverrides:
  primary: "#FF8C1A"
  secondary: "#B87333"
  accent: "#FFC64B"
  destructive: "#E4572E"
  success: "#5FB55F"
  warning: "#E8A33D"
  border: "#7A5C33"

assets:
  logo: "data:image/png;base64,"
