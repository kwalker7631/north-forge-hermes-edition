<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="flame" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#D32F2F"/>
      <stop offset="55%" stop-color="#D32F2F"/>
      <stop offset="100%" stop-color="#F2685A"/>
    </linearGradient>
    <linearGradient id="anvilShade" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F2F2F2"/>
      <stop offset="100%" stop-color="#CCCCCC"/>
    </linearGradient>
  </defs>

  <!-- background: rounded square, dark charcoal, matches terminal skin -->
  <rect x="0" y="0" width="512" height="512" rx="96" fill="#1E1E1E"/>
  <rect x="8" y="8" width="496" height="496" rx="90" fill="none" stroke="#333333" stroke-width="4"/>

  <!-- flame, rising behind/above the anvil -->
  <path d="M256 78
           C 224 128, 200 156, 214 196
           C 222 218, 244 220, 248 200
           C 258 226, 296 236, 292 274
           C 289 300, 264 312, 240 300
           C 216 288, 210 258, 224 236
           C 196 254, 186 288, 202 318
           C 218 348, 258 356, 288 336
           C 322 314, 332 270, 312 232
           C 336 208, 342 168, 320 132
           C 308 152, 296 158, 292 142
           C 298 112, 282 88, 256 78 Z"
        fill="url(#flame)"/>
  <!-- small blue spark accent - tech/diagnostic touch, not just a campfire -->
  <circle cx="322" cy="150" r="9" fill="#0A9BCD"/>

  <!-- anvil, simple bold silhouette, reads clean at small sizes -->
  <g>
    <!-- horn (tapered left point) -->
    <path d="M118 318 L214 300 L214 336 L150 350 Z" fill="url(#anvilShade)"/>
    <!-- main body / working face -->
    <rect x="208" y="292" width="150" height="52" rx="10" fill="url(#anvilShade)"/>
    <!-- waist -->
    <rect x="252" y="344" width="62" height="30" fill="#CCCCCC"/>
    <!-- base -->
    <path d="M226 374 L340 374 L358 420 L208 420 Z" fill="url(#anvilShade)"/>
    <!-- base foot shadow line -->
    <rect x="200" y="420" width="166" height="14" rx="6" fill="#AAAAAA"/>
  </g>

  <!-- ground shadow -->
  <ellipse cx="283" cy="446" rx="130" ry="14" fill="#000000" opacity="0.35"/>
</svg>
